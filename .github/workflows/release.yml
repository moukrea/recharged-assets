name: Assets release

on:
  push:
    tags: ["assets-v*"]

jobs:
  build-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/moukrea/recharged-assets-toolchain:tc1
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Compute LFS OID lockfile
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-oids
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-oids') }}
      - name: Pull LFS masters
        run: git lfs pull
      - name: Cache encoded outputs
        uses: actions/cache@v4
        with:
          path: out/cache
          key: encode-cache-${{ hashFiles('.lfs-oids') }}-tc1
          restore-keys: encode-cache-
      - name: Build full catalog
        run: |
          python3 tools/build_catalog.py --repo . --out out/catalog --cache out/cache
      - name: Fetch previous manifest (shard reuse)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --limit 20 --json tagName -q \
            '[.[] | select(.tagName | startswith("assets-v"))][0].tagName' || true)
          if [ -n "$prev" ] && [ "$prev" != "${GITHUB_REF_NAME}" ]; then
            gh release download "$prev" --pattern manifest.json --output out/prev-manifest.json
          fi
      - name: Generate manifest
        run: |
          PREV=""
          [ -f out/prev-manifest.json ] && PREV="--previous-manifest out/prev-manifest.json"
          python3 tools/make_manifest.py --catalog out/catalog \
            --tag "${GITHUB_REF_NAME}" $PREV --out out/manifest.json
          (cd out/catalog && sha256sum *.rpack) > out/SHA256SUMS
          sha256sum out/manifest.json
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/manifest.json
            out/catalog/*.rpack
      # Immutable releases are sealed the moment they are PUBLISHED, so assets
      # must all be in place first: create a draft, upload into it, verify, and
      # only then flip it to published. Creating-then-uploading fails with
      # "Cannot upload assets to an immutable release".
      - name: Create DRAFT release and upload every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" \
            --notes "Immutable asset release. Manifest sha256: $(sha256sum out/manifest.json | cut -d' ' -f1)" \
            out/manifest.json out/SHA256SUMS
          while read -r name; do
            [ -n "$name" ] && gh release upload "${GITHUB_REF_NAME}" "out/catalog/$name"
          done < out/to-upload.txt
      - name: Verify the draft, then publish (sealing it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/verify && (cd out/verify && gh release download "${GITHUB_REF_NAME}")
          (cd out/verify && sha256sum -c SHA256SUMS --ignore-missing)
          for f in out/verify/*.rpack; do python3 tools/rpack.py "$f" --verify > /dev/null; done
          # every shard the manifest expects from THIS release must be present
          python3 - <<'EOF'
          import json, os, sys
          m = json.load(open("out/manifest.json"))
          tag = os.environ["GITHUB_REF_NAME"]
          missing = [s["name"] for s in m["shards"]
                     if s["release_tag"] == tag and not os.path.exists("out/verify/" + s["name"])]
          if missing:
              sys.exit(f"{len(missing)} shard(s) missing from the draft: {missing[:5]}")
          print(f"draft complete: {len(m['shards'])} shards referenced, all present or reused")
          EOF
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          echo "published and now immutable"

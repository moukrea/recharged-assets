name: PR validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Schemas, parsers & metadata
    runs-on: ubuntu-latest
    env:
      # Contracts and metadata never need the texture masters.
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest jsonschema
      - name: Run test suite
        run: pytest tests/ -q
      - name: Compute affected materials
        id: affected
        run: |
          git fetch origin main --depth=50 || true
          echo "json=$(python tools/affected.py origin/main 2>/dev/null || echo '{}')" >> "$GITHUB_OUTPUT"
      - name: Validate committed metadata against schemas
        run: |
          python - <<'EOF'
          import json, pathlib
          import jsonschema
          repo = pathlib.Path(".")
          # cluster table sanity
          table = json.loads((repo / "schemas/shard-clusters-v1.json").read_text())
          assert table["schema_version"] == 1
          # placements/materials structural check (no LFS needed)
          placements = json.loads((repo / "metadata/jak1/placements.json").read_text())
          materials = json.loads((repo / "metadata/jak1/materials.json").read_text())
          assert set(placements["placements"].values()) == set(materials)
          print(f"OK: {len(placements['placements'])} placements, {len(materials)} materials")
          EOF

  encode-affected:
    name: Incremental encode & gates
    needs: contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/moukrea/recharged-assets-toolchain:tc1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Determine affected materials
        id: affected
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          echo "json=$(python3 tools/affected.py origin/main)" >> "$GITHUB_OUTPUT"
      - name: Pull only affected LFS objects
        run: |
          git lfs install --local
          MATS=$(echo '${{ steps.affected.outputs.json }}' | python3 -c \
            "import json,sys; print(','.join('raw/jak1/'+m+'/**' for m in json.load(sys.stdin)['materials']))")
          if [ -z "$MATS" ]; then echo "no affected materials"; exit 0; fi
          git lfs pull --include="$MATS"
      - name: Build affected (default preset, 2 profiles, fast ASTC)
        run: |
          MATS=$(echo '${{ steps.affected.outputs.json }}' | python3 -c \
            "import json,sys; print(','.join(json.load(sys.stdin)['materials']))")
          if [ -z "$MATS" ]; then echo "nothing to encode"; exit 0; fi
          python3 tools/build_catalog.py --repo . --out out/pr1 --cache out/cache \
            --materials "$MATS" --presets default \
            --profiles pc-bc,android-etc2 --astc-quality -medium
      - name: Determinism double-build
        run: |
          MATS=$(echo '${{ steps.affected.outputs.json }}' | python3 -c \
            "import json,sys; print(','.join(json.load(sys.stdin)['materials']))")
          if [ -z "$MATS" ]; then exit 0; fi
          rm -rf out/cache2
          python3 tools/build_catalog.py --repo . --out out/pr2 --cache out/cache2 \
            --materials "$MATS" --presets default \
            --profiles pc-bc,android-etc2 --astc-quality -medium
          cd out/pr1 && for f in *.rpack; do
            cmp "$f" "../pr2/$f" || { echo "NON-DETERMINISTIC: $f"; exit 1; }
          done
          echo "determinism OK"
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-report
          path: out/pr1/build-report.json
          if-no-files-found: ignore
